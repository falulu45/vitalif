<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Prototipo VITALFIT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: marco de teléfono centrado; app de 4 pestañas con barra inferior fija. Colores de marca = provisorios, reemplazar por el manual VITALFIT. */
:root{
  --bg:#e9ecef; --phone:#ffffff; --surface:#f3f5f7; --fg:#14181d; --muted:#5a6572; --line:#d9dee3;
  --brand:#e0431f; --brand-fg:#ffffff; --brand-soft:#fde6df;
  --ok:#1f8a4c; --warn:#b7791f; --alert:#c62828;
  --font-d:'Barlow Condensed','Arial Narrow',sans-serif; --font-b:'Barlow',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1014; --phone:#171b21; --surface:#212730; --fg:#f1f3f5; --muted:#a2adba; --line:#303844;
  --brand:#ff6a42; --brand-fg:#14181d; --brand-soft:#3a2018; --ok:#4cc380; --warn:#e3b04b; --alert:#ff6b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1014; --phone:#171b21; --surface:#212730; --fg:#f1f3f5; --muted:#a2adba; --line:#303844;
  --brand:#ff6a42; --brand-fg:#14181d; --brand-soft:#3a2018; --ok:#4cc380; --warn:#e3b04b; --alert:#ff6b6b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:16px;margin:0;
  padding:0;height:100%;overflow:hidden}
html{height:100%}
.note{max-width:390px;margin:0 auto 12px;font-size:13px;color:var(--muted);line-height:1.4}
.phone{width:100%;height:100%;margin:0;background:var(--phone);border:0;border-radius:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.top{padding:14px max(18px,calc((100% - 640px)/2)) 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-family:var(--font-d);font-weight:800;font-size:26px;letter-spacing:.06em;color:var(--brand)}
.user{font-size:14px;color:var(--muted)}
main{flex:1;overflow-y:auto;padding:16px max(18px,calc((100% - 640px)/2)) 20px}
h1{font-family:var(--font-d);font-size:30px;line-height:1.05;margin:0 0 4px;text-transform:uppercase;letter-spacing:.02em}
h2{font-family:var(--font-d);font-size:22px;margin:22px 0 10px;text-transform:uppercase;letter-spacing:.04em}
p{margin:0 0 10px;line-height:1.4}
.sub{color:var(--muted);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.banner{background:var(--fg);color:var(--phone);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.banner b{font-family:var(--font-d);font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--brand)}
.banner span{display:block;font-size:17px;font-weight:600;line-height:1.3;margin-top:2px}
.big{width:100%;background:var(--brand);color:var(--brand-fg);border:0;border-radius:14px;padding:18px;font-family:var(--font-d);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.05em}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;width:100%;text-align:left;font-size:17px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.chip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.f{color:var(--ok)}.m{color:var(--warn)}.d{color:var(--alert)}
.map{background:var(--surface);border-radius:14px;padding:16px 10px;display:flex;flex-direction:column;gap:0}
.lv{display:flex;align-items:center;gap:12px;padding:4px 0}
.lv:nth-child(even){flex-direction:row-reverse;text-align:right}
.node{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-d);font-weight:800;font-size:22px;background:var(--line);color:var(--muted);flex:none}
.node.done{background:var(--ok);color:#fff}.node.now{background:var(--brand);color:var(--brand-fg);box-shadow:0 0 0 5px var(--brand-soft)}
.lv small{display:block;color:var(--muted);font-size:13px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
.ex{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.ex .n{font-family:var(--font-d);font-size:28px;font-weight:800;color:var(--brand);width:28px}
.ex .t{flex:1}.ex .t b{display:block;font-size:17px}.ex .t small{color:var(--muted)}
.ex input{width:26px;height:26px;accent-color:var(--brand)}
.help{position:sticky;bottom:0;margin-top:14px;width:100%;background:var(--alert);color:#fff;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:18px}
nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--phone)}
nav button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:13px;font-weight:600;position:relative}
nav button[aria-current="true"]{color:var(--brand)}
nav svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:6px;left:calc(50% + 8px);width:11px;height:11px;border-radius:50%;background:var(--alert)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{border:0;background:none;padding:11px 6px;border-radius:9px;font-weight:700;font-size:15px;position:relative}
.tabs button[aria-selected="true"]{background:var(--phone);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.card b{display:block;margin-bottom:2px}.card small{color:var(--muted)}
.card.crit{border-color:var(--alert)}
.mach{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px;font-size:17px;font-weight:600}
.back{background:none;border:0;color:var(--brand);font-weight:700;font-size:16px;padding:0 0 10px}
.stage{position:relative;background:var(--surface);border-radius:14px;aspect-ratio:4/3;margin:10px 0}
.stage svg{width:100%;height:100%}
.hs{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:800;display:grid;place-items:center;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,67,31,.5)}100%{box-shadow:0 0 0 14px rgba(224,67,31,0)}}
@media (prefers-reduced-motion:reduce){.hs,.gif i{animation:none}}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:5}
.sheet>div{background:var(--phone);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 18px 24px}
.sheet .opt{margin-top:10px}
.gif{height:140px;background:var(--surface);border-radius:12px;margin:10px 0;display:grid;place-items:center;overflow:hidden;position:relative}
.gif i{width:46px;height:46px;border-radius:50%;background:var(--brand);animation:mv 3s ease-in-out infinite alternate}
@keyframes mv{from{transform:translateX(-80px)}to{transform:translateX(80px)}}
.gif span{position:absolute;bottom:6px;right:10px;font-size:12px;color:var(--muted)}
.goal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.goal button{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px 8px;font-weight:700}
.goal button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.toast{position:absolute;left:max(18px,calc((100% - 604px)/2));right:max(18px,calc((100% - 604px)/2));bottom:84px;background:var(--fg);color:var(--phone);padding:14px;border-radius:12px;font-weight:600;z-index:6}
</style>


<div class="phone" id="phone">
  <div class="top"><span class="logo">VITALFIT</span><span class="user">Hola, Camila</span></div>
  <main id="view"></main>
  <nav aria-label="Navegación principal">
    <button data-t="rutina"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Mi Rutina</button>
    <button data-t="maquinas"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="6" height="18" rx="1"/><path d="M10 8h8v4h-8M14 12v9"/></svg>Máquinas</button>
    <button data-t="avisos"><svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></svg>Avisos<i class="dot" id="navdot"></i></button>
    <button data-t="perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg>Perfil</button>
  </nav>
</div>

<script>
const S={tab:'rutina',screen:'home',goal:'Abdomen',avisosTab:'sede',promoSeen:false,machine:null,done:[false,false,false,false]};
const EX=[['Caminata en cinta','Cardio · 10 min','f'],['Plancha abdominal','Abdomen · 3 × 30 s','f'],['Crunch en máquina','Abdomen · 3 × 12','m'],['Remo sentado','Espalda · 3 × 10','m']];
const MACH=[['Prensa de piernas',[[28,60,'Respaldo del asiento','Ajusta el respaldo hasta que tus rodillas formen 90° al empezar.'],[70,78,'Clavija de peso','Mete la clavija en el número elegido y empuja para comprobar que quedó firme.'],[52,34,'Plataforma de pies','Apoya los pies al ancho de los hombros, sin despegar los talones.']]],['Remo sentado',[[30,50,'Altura del asiento','Sube o baja el asiento hasta que el pecho quede frente al apoyo.'],[72,72,'Clavija de peso','Elige el peso con la clavija. Empieza liviano.'],[60,38,'Agarres','Tira con los codos pegados al cuerpo, espalda recta.']]],['Crunch en máquina',[[34,62,'Perilla de asiento','Gira la perilla para que el eje de la máquina quede a la altura de tu cintura.'],[75,70,'Clavija de peso','Selecciona un peso bajo. Debes poder hacer 12 repeticiones.'],[50,35,'Agarres','Sujeta los agarres sin tirar con los brazos; el movimiento sale del abdomen.']]]];
const $=s=>document.querySelector(s);
const view=$('#view');
function go(t){S.tab=t;S.screen=t==='rutina'?'home':'list';S.machine=null;render()}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.t===S.tab));
  $('#navdot').hidden=S.promoSeen;
  const f={rutina:S.screen==='home'?home:routine,maquinas:S.machine===null?machines:machine,avisos:avisos,perfil:perfil}[S.tab];
  view.innerHTML=f(); view.scrollTop=0; bind();
}
function home(){
  const lv=[['Nivel 1','Completado',1],['Nivel 2','Completado',1],['Nivel 3','Hoy: Abdomen',0],['Nivel 4','Bloqueado',2],['Nivel 5','Bloqueado',2]];
  return `<div class="banner"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2.5"><path d="M12 3 2 21h20zM12 10v5M12 18v.5"/></svg><div><b>Aviso de sede · hoy</b><span>Sábado 14: la sede cierra a las 14:00 por feriado.</span></div></div>
  <h1>Tu rutina de hoy</h1><p class="sub">Objetivo: ${S.goal} · Dificultad fácil a media</p>
  <button class="big" data-a="start">Iniciar rutina</button>
  <h2>Tu camino</h2>
  <div class="row"><span class="sub">Nivel 3 de 5</span><span class="sub">40%</span></div><div class="bar" style="margin:6px 0 12px"><i style="width:40%"></i></div>
  <div class="map">${lv.map(l=>`<div class="lv"><div class="node ${l[2]===1?'done':l[2]===0?'now':''}">${l[2]===1?'✓':l[0].slice(-1)}</div><div><b>${l[0]}</b><small>${l[1]}</small></div></div>`).join('')}</div>
  <h2>Reparto de hoy</h2><p class="sub">50% Abdomen · 30% Espalda · 20% Hombros. Ayer trabajaste piernas, hoy descansan.</p>`;
}
function routine(){
  return `<button class="back" data-a="home">‹ Volver</button><h1>Rutina · Nivel 3</h1><p class="sub">Marca cada ejercicio al terminarlo.</p>
  ${EX.map((e,i)=>`<div class="ex"><span class="n">${i+1}</span><div class="t"><b>${e[0]}</b><small>${e[1]}</small></div><span class="chip ${e[2]}">${e[2]==='f'?'Fácil':'Medio'}</span><input type="checkbox" aria-label="Terminado: ${e[0]}" data-i="${i}" ${S.done[i]?'checked':''}></div>`).join('')}
  <button class="help" data-a="help">Asistir en sala</button>`;
}
function machines(){
  return `<h1>Máquinas</h1><p class="sub">Elige una para ver cómo se ajusta.</p><div style="height:8px"></div>${MACH.map((m,i)=>`<button class="mach" data-m="${i}">${m[0]}<span aria-hidden="true">›</span></button>`).join('')}`;
}
function machine(){
  const m=MACH[S.machine];
  return `<button class="back" data-a="mlist">‹ Máquinas</button><h1>${m[0]}</h1><p class="sub">Toca los puntos numerados.</p>
  <div class="stage"><svg viewBox="0 0 100 75" aria-hidden="true"><rect x="8" y="64" width="84" height="5" rx="2" fill="var(--line)"/><rect x="62" y="14" width="10" height="50" rx="2" fill="var(--muted)"/><rect x="70" y="52" width="16" height="12" rx="2" fill="var(--fg)" opacity=".5"/><rect x="18" y="38" width="22" height="8" rx="3" fill="var(--muted)"/><rect x="20" y="22" width="7" height="22" rx="3" fill="var(--muted)"/><path d="M40 42h22M44 30h18" stroke="var(--muted)" stroke-width="3"/></svg>
  ${m[1].map((h,i)=>`<button class="hs" style="left:${h[0]}%;top:${h[1]}%;background:var(--brand)" data-h="${i}" aria-label="${h[2]}">${i+1}</button>`).join('')}</div>
  <p class="sub">${m[1].length} puntos de ajuste. Cada uno tiene una demostración de 3 segundos.</p>`;
}
function avisos(){
  const sede=S.avisosTab==='sede';
  return `<h1>Avisos</h1><div class="tabs" role="tablist"><button role="tab" aria-selected="${sede}" data-v="sede">Avisos de sede</button><button role="tab" aria-selected="${!sede}" data-v="promo">Beneficios y promociones${S.promoSeen?'':'<i class="dot" style="top:4px;left:auto;right:6px"></i>'}</button></div>`+(sede?
  `<div class="card crit"><b>Cierre por feriado</b><small>Sábado 14 · cierra a las 14:00</small></div><div class="card"><b>Máquina en mantenimiento</b><small>Prensa de piernas 2 · vuelve el lunes</small></div><div class="card"><b>Nuevo horario de clases</b><small>Desde el 16: spinning a las 19:00</small></div>`:
  `<div class="card"><b>Plan semestral con 15% de descuento</b><small>Válido hasta fin de mes</small></div><div class="card"><b>Proteína de suero · 2×1</b><small>Pide en recepción</small></div><div class="card"><b>Trae un amigo</b><small>Entrada gratis por semana</small></div>`);
}
function perfil(){
  return `<h1>Perfil</h1><p class="sub">Camila · Plan mensual · Socia desde hace 3 semanas</p><h2>Mi objetivo</h2>
  <div class="goal">${['Abdomen','Piernas','Espalda','Bajar peso'].map(g=>`<button data-g="${g}" aria-pressed="${S.goal===g}">${g}</button>`).join('')}</div>
  <p class="sub" style="margin-top:14px">Tu rutina se ajusta cuando cambias el objetivo.</p>`;
}
function sheet(html){const d=document.createElement('div');d.className='sheet';d.innerHTML=`<div>${html}</div>`;$('#phone').appendChild(d);
  d.addEventListener('click',e=>{if(e.target===d||e.target.dataset.close!==undefined)d.remove()});return d}
function toast(t){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;$('#phone').appendChild(d);setTimeout(()=>d.remove(),3500)}
function bind(){
  view.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;
    if(a==='start'){S.screen='routine';render()}else if(a==='home'){S.screen='home';render()}else if(a==='mlist'){S.machine=null;render()}
    else if(a==='help'){const s=sheet(`<h1>¿En qué te ayudamos?</h1><p class="sub">Un instructor recibirá tu aviso.</p><button class="ghost opt" data-r="Ayuda con máquina">Ayuda con máquina</button><button class="ghost opt" data-r="Asistencia de postura">Asistencia de postura</button><button class="ghost opt" data-close style="text-align:center;color:var(--muted)">Cancelar</button>`);
      s.querySelectorAll('[data-r]').forEach(o=>o.onclick=()=>{s.remove();toast('Aviso enviado: '+o.dataset.r+'. Un instructor va en camino.')})}});
  view.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.machine=+b.dataset.m;render()});
  view.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const h=MACH[S.machine][1][+b.dataset.h];
    sheet(`<h1>${h[2]}</h1><div class="gif"><i></i><span>Demostración en bucle · 3 s</span></div><p>${h[3]}</p><button class="big" data-close>Entendido</button>`)});
  view.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.avisosTab=b.dataset.v;if(b.dataset.v==='promo')S.promoSeen=true;render()});
  view.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.goal=b.dataset.g;render()});
  view.querySelectorAll('[data-i]').forEach(c=>c.onchange=()=>{S.done[+c.dataset.i]=c.checked;if(S.done.every(Boolean))toast('Nivel 3 completado. Desbloqueaste el nivel 4.')});
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
render();
</script>

</body></html>
